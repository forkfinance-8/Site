[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify auto-detects the "qualificacao" form because it's a plain static
# HTML form with data-netlify="true" — no extra config needed for it to work.

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
